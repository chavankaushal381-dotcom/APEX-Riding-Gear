apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-riding-gear
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-riding-gear
  template:
    metadata:
      labels:
        app: apex-riding-gear
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: apex-website
          image: 358563824856.dkr.ecr.ap-southeast-2.amazonaws.com/apex-riding-gear:v1
          ports:
            - containerPort: 80
